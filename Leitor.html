<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Registar Encomenda</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:#111;color:#fff;font-family:Arial;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:20px;text-align:center}
.card{background:#222;padding:25px;border-radius:16px;max-width:400px;width:100%;box-shadow:0 4px 15px rgba(0,0,0,0.5)}
h2{margin-top:0;color:#20d66b}
p{color:#aaa;font-size:14px;margin-bottom:20px}
button, label.btn-foto{display:block;width:100%;border:0;border-radius:10px;padding:15px;background:#20d66b;color:#000;font-weight:bold;font-size:16px;cursor:pointer;text-align:center;margin-top:12px;text-decoration:none}
label.btn-foto{background:#20d66b}
.btn-voltar{background:#444;color:#fff}
input[type="file"]{display:none}
#preview{margin-top:15px;max-width:100%;max-height:200px;border-radius:8px;display:none}
</style>
</head>
<body>

<div class="card">
  <h2>📷 Foto da Encomenda</h2>
  <p>Tire uma foto nítida da etiqueta ou da encomenda para registo.</p>

  <!-- Botão que abre diretamente a câmara do telemóvel -->
  <label for="camInput" class="btn-foto">📸 Tirar Foto</label>
  <input type="file" id="camInput" accept="image/*" capture="environment" onchange="mostrarFoto(event)">

  <img id="preview" alt="Pré-visualização da foto">

  <button id="btnUsar" class="hide" style="display:none;" onclick="usarFoto()">✅ USAR ESTA FOTO</button>
  <button class="btn-voltar" onclick="fechar()">← Voltar</button>
</div>

<script>
let imagemBase64 = '';

function mostrarFoto(event) {
  let file = event.target.files[0];
  if (!file) return;

  let reader = new FileReader();
  reader.onload = function(e) {
    imagemBase64 = e.target.result;
    let img = document.getElementById('preview');
    img.src = imagemBase64;
    img.style.display = 'block';
    document.getElementById('btnUsar').style.display = 'block';
  };
  reader.readAsDataURL(file);
}

function usarFoto() {
  if (!imagemBase64) {
    alert('Nenhuma foto capturada.');
    return;
  }

  if (window.opener && !window.opener.closed) {
    // Envia a foto (ou um aviso de foto capturada) de volta para a aplicação principal
    window.opener.postMessage({ tipo: 'PORTARIA_FOTO', codigo: 'FOTO_REGISTRADA', imagem: imagemBase64 }, '*');
    window.close();
  } else {
    alert('Foto pronta! Volte ao aplicativo de portaria.');
  }
}

function fechar() {
  window.close();
}
</script>

</body>
</html>
